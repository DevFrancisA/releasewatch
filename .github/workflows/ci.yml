name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: releasewatch
          POSTGRES_PASSWORD: releasewatch
          POSTGRES_DB: releasewatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U releasewatch"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      RELEASEWATCH_TEST_DATABASE_URL: postgresql+psycopg://releasewatch:releasewatch@localhost:5432/releasewatch_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - name: Migrations match models
        run: DATABASE_URL=$RELEASEWATCH_TEST_DATABASE_URL alembic check

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end (Playwright on docker compose)
    runs-on: ubuntu-latest
    env:
      RELEASEWATCH_HEALTH_CHECK_INITIAL_DELAY_SECONDS: "1"
      RELEASEWATCH_HEALTH_CHECK_INTERVAL_SECONDS: "1"
      RELEASEWATCH_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: Smoke checks against the local stack
        run: python3 scripts/smoke.py http://localhost:8000 --expect-commit "$GITHUB_SHA" --webhook-secret dev-webhook-secret --wait 120
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Deploys only after every test job passes on main, then verifies the hosted
  # service. Configure in the "production" environment:
  #   secret RENDER_DEPLOY_HOOK_URL  - Render deploy hook for the web service
  #   secret WORKER_DEPLOY_HOOK_URL  - (optional) deploy hook for the worker
  #   secret PRODUCTION_WEBHOOK_SECRET - (optional) enables the signed webhook smoke check
  #   var    PRODUCTION_URL          - e.g. https://releasewatch.onrender.com
  deploy:
    name: Deploy + smoke checks
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      WORKER_HOOK: ${{ secrets.WORKER_DEPLOY_HOOK_URL }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      WEBHOOK_SECRET: ${{ secrets.PRODUCTION_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$DEPLOY_HOOK" ] || [ -z "$PRODUCTION_URL" ]; then
            echo "::notice::Deploy skipped: set RENDER_DEPLOY_HOOK_URL and PRODUCTION_URL on the production environment to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger deploy of this commit
        if: steps.config.outputs.enabled == 'true'
        run: |
          curl --fail --silent --show-error -X POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}"
          if [ -n "$WORKER_HOOK" ]; then
            curl --fail --silent --show-error -X POST "${WORKER_HOOK}&ref=${GITHUB_SHA}"
          fi
      - name: Smoke checks against production
        if: steps.config.outputs.enabled == 'true'
        run: |
          python3 scripts/smoke.py "$PRODUCTION_URL" \
            --expect-commit "$GITHUB_SHA" \
            ${WEBHOOK_SECRET:+--webhook-secret "$WEBHOOK_SECRET"} \
            --wait 900
